services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dimatech
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/dimatech
      SECRET_KEY: super-secret-key-change-in-production
      JWT_SECRET: jwt-secret-change-in-production
      WEBHOOK_SECRET: gfdmhghif38yrf9ew0jkf32
      DEBUG: "true"
    ports:
      - "8088:8000"

volumes:
  pgdata:
